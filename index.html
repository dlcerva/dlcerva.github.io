<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Davide La Cerva — Architecture Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #111111;
            color: #f2f2f2;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            flex-direction: column;

            padding: 48px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .name {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.04em;
        }

        .discipline {
            font-size: 12px;
            color: #999999;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: 7px;
        }

        main {
            flex: 1;

            display: flex;
            flex-direction: column;
            justify-content: center;

            max-width: 1100px;
            margin: 80px auto;
            width: 100%;
        }

        h1 {
            font-size: clamp(48px, 8vw, 110px);
            line-height: 0.92;
            font-weight: 400;
            letter-spacing: -0.05em;
            margin-bottom: 55px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .button {
            display: inline-block;

            padding: 15px 22px;

            color: #f2f2f2;
            text-decoration: none;

            border: 1px solid #555555;

            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;

            transition: 0.25s ease;
        }

        .button:hover {
            background: #f2f2f2;
            color: #111111;
            border-color: #f2f2f2;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;

            font-size: 11px;
            color: #777777;

            letter-spacing: 0.05em;
        }

        @media (max-width: 600px) {

            body {
                padding: 28px;
            }

            main {
                margin: 60px auto;
            }

            h1 {
                font-size: 18vw;
                margin-bottom: 40px;
            }

            .buttons {
                flex-direction: column;
                align-items: stretch;
            }

            .button {
                width: 100%;
                text-align: center;
            }

            footer {
                gap: 20px;
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <header>

        <div>
            <div class="name">
                Davide La Cerva
            </div>

            <div class="discipline">
                Architecture · Exhibition Design
            </div>
        </div>

    </header>


    <main>

        <h1>
            Architecture<br>
            Portfolio
        </h1>


        <div class="buttons">

            <!-- PORTFOLIO -->
            <a
                class="button"
                href="https://heyzine.com/flip-book/9cd0450309.html"
                target="_blank"
                rel="noopener noreferrer">

                View Portfolio

            </a>


            <!-- CV ITALIANO -->
            <a
                class="button"
                href="CV_DAVIDE_LA_CERVA.pdf"
                target="_blank"
                rel="noopener noreferrer">

                View CV — IT

            </a>


            <a
                class="button"
                href="CV_DAVIDE_LA_CERVA.pdf"
                download="Davide_La_Cerva_CV_IT.pdf">

                Download CV — IT

            </a>


            <!-- CV ENGLISH -->
            <a
                class="button"
                href="CV_DAVIDE_LA_CERVA_ENG.pdf"
                target="_blank"
                rel="noopener noreferrer">

                View CV — ENG

            </a>


            <a
                class="button"
                href="CV_DAVIDE_LA_CERVA_ENG.pdf"
                download="Davide_La_Cerva_CV_ENG.pdf">

                Download CV — ENG

            </a>

        </div>

    </main>


    <footer>

        <span>
            Politecnico di Milano
        </span>

        <span>
            © 2026 Davide La Cerva
        </span>

    </footer>

</body>

</html>
